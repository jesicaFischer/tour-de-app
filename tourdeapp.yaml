exposedPort: 80
containers:
  - name: web
    image: registry.tourde.cloud/die_chipettes/web
    port: 3000
    env:
      PORT: "3000"
      VITE_API_URL: "/api"
  - name: server
    image: registry.tourde.cloud/die_chipettes/server
    port: 3001
    env:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: product
      MYSQL_USER: root
      MYSQL_PASSWORD: password
      PORT: "3001"

branch: origin/main
services:
  - name: mysql
    image: mysql
    tag: "8.4"
    env:
      MYSQL_DATABASE: product
      MYSQL_ROOT_PASSWORD: password
    port: 3306
  - name: caddy
    image: registry.tourde.cloud/die_chipettes/caddy
    port: 80
build:
  - name: web
    context: ./frontend
    dockerfile: ./frontend/Dockerfile
    args:
      VITE_API_URL: "/api"
  - name: server
    context: ./backend
    dockerfile: ./backend/docker/Dockerfile
  - name: caddy
    context: ./caddy
    dockerfile: ./caddy/Dockerfile
